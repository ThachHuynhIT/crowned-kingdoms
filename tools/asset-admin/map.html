<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dựng bản đồ · Crowned Kingdoms</title><link rel="stylesheet" href="admin.css"></head><body>
<header><a class="brand" href="map.html">♛ Crowned Kingdoms / Dựng bản đồ</a><a href="index.html">← Kho asset</a></header><p id="status" role="status"></p>
<main class="map-layout"><section class="palette"><nav id="tabs" class="tabs" aria-label="Danh mục"></nav><input id="search" type="search" aria-label="Tìm asset" placeholder="Tìm tên, id, tags…"><label>Nhóm <select id="group" aria-label="Lọc nhóm asset"></select></label><div id="thumbs" class="thumbs"></div></section>
<section class="map-right"><div class="controls"><label>Rộng <input id="cols" type="number" min="1" max="40" value="12"></label><label>Cao <input id="rows" type="number" min="1" max="40" value="8"></label><button id="resize">Đổi kích thước</button><label>Zoom <select id="zoom"><option>1</option><option>2</option><option>3</option><option>4</option></select>×</label><label><input id="grid" type="checkbox" checked>Lưới</label><label>Nền <input id="bg" type="color" value="#526b40"></label><label><input id="animate" type="checkbox">Chạy animation đứng</label></div>
<div class="controls"><label>Công cụ <select id="tool"><option value="select">Chọn / di chuyển</option><option value="place">Đặt asset</option><option value="fill">Lấp đầy ô (kéo vùng)</option><option value="scatter">Rải ngẫu nhiên (kéo vùng)</option></select></label><label>N <input id="count" type="number" min="1" max="2000" value="20"></label><label>Seed <input id="seed" type="text" value="kingdom-1"></label><button id="undo">Hoàn tác</button><button id="redo">Làm lại</button><button id="clear">Xoá hết</button></div>
<div class="controls"><span id="selection" class="selection-info">Chưa chọn</span><button id="flip">Lật ngang</button><button id="up">Đưa lên</button><button id="down">Đưa xuống</button><label>Phe <select id="team"><option value="ally">Ta</option><option value="foe">Địch</option></select></label><button id="duplicate">Nhân bản</button><button id="delete">Xoá chọn</button></div>
<div class="controls"><input id="name" type="text" placeholder="Tên bản đồ" aria-label="Tên bản đồ"><button id="save">Lưu</button><select id="saved" aria-label="Bản đồ đã lưu"></select><button id="load">Tải</button><button id="remove">Xoá bản lưu</button><button id="export">Xuất JSON</button><button id="import">Nhập JSON</button><input id="file" class="file-input" type="file" accept=".json,application/json"><button id="png">Xuất PNG</button></div>
<p id="dimensions" class="hint"></p><div class="controls"><label>Vua <select id="king" aria-label="Vua xem trước"></select></label><button id="preview">Tạo bàn cờ 5×5 (thay bản đồ)</button><label>Vùng trống (ô): X <input id="emptyX" type="number" min="0" value="3"></label><label>Y <input id="emptyY" type="number" min="0" value="1"></label><label>Rộng <input id="emptyW" type="number" min="1" value="5"></label><label>Cao <input id="emptyH" type="number" min="1" value="5"></label><button id="forest">Rải rừng bao quanh</button></div><p class="hint">Kéo asset vào bản đồ · Shift: snap 8 px ảnh = 4 đơn vị thế giới / chọn thêm · Kéo vùng trống / Alt + kéo trên tile: chọn nhiều · Space + kéo: cuộn · Esc: bỏ chọn · Delete: xoá · Ctrl+D: nhân bản · Ctrl+Z/Y: hoàn tác/làm lại</p><div id="viewport" class="viewport"><canvas id="map" aria-label="Bản đồ pixel" tabindex="0"></canvas></div></section></main><script type="module" src="map.js"></script></body></html>
