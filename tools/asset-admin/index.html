<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho asset · Crowned Kingdoms</title><link rel="stylesheet" href="/tools/asset-admin/admin.css"></head>
<body><header><a class="brand" href="/admin">♛ Crowned Kingdoms / Kho asset</a><a href="/admin/map">Dựng bản đồ →</a></header>
<div class="toolbar"><input id="search" type="search" placeholder="Tìm id, tên, tags, nhóm…" aria-label="Tìm asset"><label>Nhóm <select id="group" aria-label="Lọc theo nhóm"></select></label><label>Phóng <input id="zoom" type="range" min="1" max="8" value="2"><output id="zoomLabel">2×</output></label><label>Nền <select id="background"><option value="checker">Caro sáng</option><option value="checker-dark">Caro tối</option><option value="grass">Xanh cỏ</option><option value="dark">Tối</option><option value="white">Trắng</option></select></label><label><input id="border" type="checkbox" checked> Viền ảnh</label><label><input id="guides" type="checkbox"> Lưới 32 đơn vị</label></div>
<div class="toolbar"><label>Trạng thái <select id="availability"><option value="">Tất cả</option><option value="available">Đã có</option><option value="missing">Chưa có</option></select></label><label>Ưu tiên (mục chưa có) <select id="priority"><option value="">Tất cả ưu tiên</option><option>P0</option><option>P1</option><option>P2</option></select></label><button id="copy-missing" type="button">Sao chép danh sách chưa có</button><button id="download-missing" type="button">Tải planned-missing.json</button></div>
<p id="summary" class="catalogue-summary"></p><p id="load-status" class="load-status" role="alert"></p><nav id="tabs" class="tabs" aria-label="Danh mục"></nav><p id="status" role="status"></p><main class="viewer"><section id="cards" class="cards"></section><aside id="detail"><h2>Chi tiết asset</h2><p>Chọn một thẻ để xem ảnh và đường dẫn.</p></aside></main><script type="module" src="/tools/asset-admin/src/admin.ts"></script></body></html>
